apply plugin: 'com.android.application'

// Release signing is read from android/keystore.properties, which is gitignored
// and holds the passwords for the upload keystore. When that file is absent
// (fresh clone, CI debug build, anyone who only wants to sideload) the release
// signing config is simply not created and `assembleDebug` still works — only
// `bundleRelease` / `assembleRelease` need it. See ANDROID.md.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.lingonect.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lingonect.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Shared debug key, committed on purpose. Android's per-machine default
        // debug keystore has a different SHA-1 on every machine and is created
        // fresh on every CI runner, so Google Sign-In (which validates the app's
        // signing fingerprint) would only ever work on whichever machine's
        // fingerprint happened to be registered in Firebase. Signing all debug
        // builds with one committed key gives a single stable SHA-1 to register.
        // It signs test builds ONLY — release builds use the keystore above, and
        // Play rejects a debug-signed upload.
        debug {
            storeFile rootProject.file('lingonect-debug.keystore')
            storePassword 'lingonectdebug'
            keyAlias 'lingonectdebug'
            keyPassword 'lingonectdebug'
        }

        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            signingConfig signingConfigs.debug
            // Deliberately NO applicationIdSuffix: the debug build keeps the
            // package name com.lingonect.app so it matches the single Android
            // app registered in Firebase. A suffixed package would need its own
            // Firebase registration and its own SHA-1 before Google Sign-In
            // would work in sideloaded test builds.
            versionNameSuffix "-debug"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
