apply plugin: 'com.android.application'

// Release signing comes from one of two places, so the same build works on a
// machine with the keystore on disk and in CI with it in secrets:
//
//   1. Environment variables (ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD,
//      ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) — how CI passes them, after
//      writing the keystore out from a secret.
//   2. android/keystore.properties, gitignored — for building a release
//      locally.
//
// Environment wins where both exist. When neither is present the release
// signing config is simply not created and `assembleDebug` still works; only
// `bundleRelease` / `assembleRelease` need it. See ANDROID.md.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def signingSetting = { String envName, String propName ->
    def fromEnv = System.getenv(envName)
    return (fromEnv != null && !fromEnv.isEmpty()) ? fromEnv : keystoreProperties[propName]
}

def releaseStoreFile = signingSetting("ANDROID_KEYSTORE_FILE", "storeFile")
def releaseStorePassword = signingSetting("ANDROID_KEYSTORE_PASSWORD", "storePassword")
def releaseKeyAlias = signingSetting("ANDROID_KEY_ALIAS", "keyAlias")
def releaseKeyPassword = signingSetting("ANDROID_KEY_PASSWORD", "keyPassword")
def hasReleaseKeystore = releaseStoreFile != null && !releaseStoreFile.toString().isEmpty()

// Absolute paths are used as-is so CI can write the keystore outside the
// project tree; relative ones resolve against android/, where
// keystore.properties lives.
def resolvedReleaseStoreFile = null
if (hasReleaseKeystore) {
    def candidate = new File(releaseStoreFile.toString())
    resolvedReleaseStoreFile = candidate.isAbsolute() ? candidate : rootProject.file(releaseStoreFile)
}

android {
    namespace "com.lingonect.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lingonect.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI stamps these so each published test build is distinguishable and
        // Android treats a newer download as an update rather than refusing to
        // install it. Locally they fall back to the plain 1.0 defaults.
        versionCode System.getenv("ANDROID_VERSION_CODE") ?
                    System.getenv("ANDROID_VERSION_CODE").toInteger() : 1
        versionName System.getenv("ANDROID_VERSION_NAME") ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Shared debug key, committed on purpose. Android's per-machine default
        // debug keystore has a different SHA-1 on every machine and is created
        // fresh on every CI runner, so Google Sign-In (which validates the app's
        // signing fingerprint) would only ever work on whichever machine's
        // fingerprint happened to be registered in Firebase. Signing all debug
        // builds with one committed key gives a single stable SHA-1 to register.
        // It signs test builds ONLY — release builds use the keystore above, and
        // Play rejects a debug-signed upload.
        debug {
            storeFile rootProject.file('lingonect-debug.keystore')
            storePassword 'lingonectdebug'
            keyAlias 'lingonectdebug'
            keyPassword 'lingonectdebug'
        }

        if (hasReleaseKeystore) {
            release {
                storeFile resolvedReleaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            signingConfig signingConfigs.debug
            // Deliberately NO applicationIdSuffix: the debug build keeps the
            // package name com.lingonect.app so it matches the single Android
            // app registered in Firebase. A suffixed package would need its own
            // Firebase registration and its own SHA-1 before Google Sign-In
            // would work in sideloaded test builds.
            versionNameSuffix "-debug"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
