# Deploys to https://falcon.hanyuriyu.workers.dev
name = "falcon"
main = "../falcon-worker.js"
compatibility_date = "2026-03-24"
workers_dev = true
preview_urls = false

[[kv_namespaces]]
binding = "QUOTA_KV"
id = "f9f80346649545989106f2b6459bbb28"

# Falcon-H1-7B-Instruct runs on our own Hugging Face backend. HF_TOKEN
# is a secret:  npx wrangler secret put HF_TOKEN -c workers/wrangler/falcon.toml
#
# ZeroGPU Space (HF PRO): set FALCON_SPACE_URL to the Space's direct URL, e.g.
#   https://hanyuriyu-falcon-arabic.hf.space   (Space ⋮ menu → "Embed this Space")
# Inference Endpoint instead: leave FALCON_SPACE_URL empty and set
# FALCON_ENDPOINT_URL; FALCON_MODEL may stay empty (read from /v1/models).
[vars]
FALCON_SPACE_URL = "https://hanyuriyu-falcon-arabic.hf.space"
FALCON_ENDPOINT_URL = ""
FALCON_MODEL = ""

[observability]
enabled = true
