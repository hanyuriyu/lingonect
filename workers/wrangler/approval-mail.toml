# Deploys to https://approval-mail.hanyuriyu.workers.dev
# Admin account actions for admin.html: the "your access is approved" email
# (POST /) and deleting a user with a reason email (POST /delete-user).
# Secrets, set in the Cloudflare dashboard, never here:
#   GMAIL_SA_KEY           service-account key that sends as contact@lingonect.com
#   FIREBASE_ADMIN_SA_KEY  service-account key with Firebase Authentication Admin,
#                          Cloud Datastore User and Firebase Realtime Database Admin
name = "approval-mail"
main = "../approval-mail-worker.js"
compatibility_date = "2026-03-24"
workers_dev = true
preview_urls = false

[observability]
enabled = true
