# Deploys to https://kimi.hanyuriyu.workers.dev
name = "kimi"
main = "../kimi-worker.js"
compatibility_date = "2026-03-24"
workers_dev = true
preview_urls = false

[[kv_namespaces]]
binding = "QUOTA_KV"
id = "f9f80346649545989106f2b6459bbb28"

# Model id lives here so a rename upstream is a config edit, not a code change.
# Override in the dashboard (Settings > Variables) if needed. GET the deployed
# worker to see which ids the key can actually reach.
[vars]
KIMI_MODEL = "kimi-k2.6"
# kimi-k2.6 runs in thinking mode and accepts only temperature 1 — it rejects
# the 0.3 the other translation proxies use. The worker retries once using
# whatever value Moonshot names in the error, so this rarely needs touching.
KIMI_TEMPERATURE = "1"

[observability]
enabled = true
