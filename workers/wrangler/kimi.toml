# Deploys to https://kimi.hanyuriyu.workers.dev
name = "kimi"
main = "../kimi-worker.js"
compatibility_date = "2026-03-24"
workers_dev = true
preview_urls = false

[[kv_namespaces]]
binding = "QUOTA_KV"
id = "f9f80346649545989106f2b6459bbb28"

# Model id lives here so a rename upstream is a config edit, not a code change.
# Override in the dashboard (Settings > Variables) if needed. GET the deployed
# worker to see which ids the key can actually reach.
[vars]
# Turbo build: same Kimi K2 quality, much faster replies, so it stays inside
# the site's 30s timeout. If Moonshot ever retires this id, the worker falls
# back to KIMI_FALLBACK_MODEL on its own.
KIMI_MODEL = "kimi-k2-turbo-preview"
KIMI_FALLBACK_MODEL = "kimi-k2.6"
# Instant mode: thinking-mode reasoning counts against max_tokens and left
# long non-Latin translations with an empty answer. Set "enabled" to reason.
KIMI_THINKING = "disabled"
# kimi-k2.x pins temperature per mode: 0.6 instant, 1 thinking. The worker
# retries once using whatever value Moonshot names in the error, so this
# rarely needs touching — but keep it in step with KIMI_THINKING.
KIMI_TEMPERATURE = "0.6"

[observability]
enabled = true
