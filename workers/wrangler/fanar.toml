# Deploys to https://fanar.hanyuriyu.workers.dev
name = "fanar"
main = "../fanar-worker.js"
compatibility_date = "2026-03-24"
workers_dev = true
preview_urls = false

[[kv_namespaces]]
binding = "QUOTA_KV"
id = "f9f80346649545989106f2b6459bbb28"

# Model id lives here so a rename upstream is a config edit, not a code change.
# GET the deployed worker to see which ids the key can actually reach.
# Pinned to the 27B chat model: the bare "Fanar" id routes requests and once
# answered a one-line translation request with an unrelated article.
[vars]
FANAR_MODEL = "Fanar-C-2-27B"
# Retried once when the main model refuses or errors; the 27B model does so
# intermittently with a key that works moments later.
FANAR_FALLBACK_MODEL = "Fanar-S-1-7B"

[observability]
enabled = true
