# Fly.io deployment for the Baidu relay.
#
# The relay only earns its keep if its outbound IP is stable, so the app needs
# a dedicated IPv4 (`fly ips allocate-v4`) and must not scale to zero — see
# README.md, which also covers how to verify the egress address before handing
# it to Baidu.
app = "lingonect-baidu-relay"
primary_region = "nrt"          # Tokyo: closest Fly region to Baidu's API.

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false    # A stopped machine can come back on a new IP.
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
