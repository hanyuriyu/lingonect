# Builds the Lingonect Android app and publishes an installable APK as a
# workflow artifact. Android needs no Mac, so CI can produce a testable build
# on every push — download the artifact, copy it to a phone, install.
#
# Builds on main are also published to a GitHub Release under a fixed tag, so
# there is one permanent URL you can open directly on a phone to install the
# latest test build — no GitHub login, no zip, no expiry.

name: Android

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "**.html"
      - "*.css"
      - "app-native.js"
      - "android/**"
      - "assets/**"
      - "scripts/copy-web.mjs"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same branch.
# The event name is part of the group because a manual run and a push share the
# same github.ref: without it, dispatching a build cancels the branch's push
# build, and GitHub then reports that cancelled run as a failing check on the
# pull request even though nothing actually broke.
concurrency:
  group: android-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Debug APK (sideload)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to publish the release below
    # The `secrets` context is not available in step-level `if:`, so surface the
    # optional Firebase config as an env var the steps can test and consume.
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Capacitor 7 requires JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # copy-web.mjs stages the plain HTML/CSS/images into www/, then Capacitor
      # copies www/ into the native project. No bundler involved.
      - name: Build web bundle and sync Capacitor
        run: |
          npm run copy-web
          npx cap sync android

      # google-services.json is not in the repo by default. Without it the app
      # still builds and email/password login works; Google Sign-In needs it.
      # Add it as a repository secret to enable Google Sign-In in CI builds.
      - name: Write google-services.json (if configured)
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "google-services.json written ($(wc -c < android/app/google-services.json) bytes)"

      - name: Report Google Sign-In availability
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "::notice::google-services.json present — Google Sign-In enabled in this build."
          else
            echo "::warning::No google-services.json — this build has email/password login only. Google Sign-In will show an error. See ANDROID.md."
          fi

      # Stamp a distinguishable version into the APK. The version name shows up
      # under Settings > Apps > Lingonect on the phone, so you can confirm which
      # build you are actually looking at while testing.
      - name: Work out the version
        id: version
        run: |
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew --no-daemon assembleDebug

      # Both ways this went wrong once are silent by default, so assert on them.
      # The google-services plugin is applied conditionally, so a misplaced
      # config file leaves a perfectly green build that simply has no Firebase
      # config in it; and Firebase happily issues a google-services.json with no
      # Android OAuth client if the app was registered without a SHA-1, which
      # only shows up as ApiException 10 on the device.
      - name: Verify the Firebase config was actually compiled in
        if: ${{ hashFiles('android/app/google-services.json') != '' }}
        run: |
          set -uo pipefail
          # Search by content rather than a fixed path: the google-services
          # plugin has moved its output directory between versions (it was
          # res/google-services/<variant>/, now res/processDebugGoogleServices/),
          # and what actually matters is that the google_app_id resource exists.
          HIT=$(grep -rl "google_app_id" android/app/build/generated 2>/dev/null | head -1)
          if [ -z "$HIT" ]; then
            echo "::error::google-services.json exists but the plugin generated no google_app_id resource, so the APK has no Firebase config. The file is probably in the wrong directory — it must be android/app/, not android/. See ANDROID.md."
            echo "--- what the build did generate under android/app/build/generated/res ---"
            find android/app/build/generated/res -maxdepth 3 2>/dev/null | head -40 || echo "(no generated res directory at all)"
            exit 1
          fi
          echo "::notice::Firebase Android config compiled into the APK (found in ${HIT})."

          if jq -e '[.client[]?.oauth_client[]?.client_type] | index(1) != null' \
               android/app/google-services.json >/dev/null 2>&1; then
            echo "::notice::Android OAuth client present — a SHA-1 fingerprint is registered."
          else
            echo "::warning::google-services.json has no Android OAuth client (client_type 1), so no SHA-1 fingerprint is registered in Firebase. Google Sign-In will fail on the device with ApiException 10. Add the fingerprint in Firebase, re-download the file, and replace it. See ANDROID.md."
          fi

      - name: Name the artifact after the commit
        id: name
        run: echo "apk=lingonect-debug-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ---- Publish the installable link ----
      # A single rolling release under a fixed tag. The download URL therefore
      # never changes and can be bookmarked on a phone:
      #   https://github.com/<owner>/<repo>/releases/download/android-latest/lingonect.apk
      # Only main publishes, so branch and PR builds do not overwrite the link;
      # a manual run can publish too, for testing this workflow itself.
      - name: Publish rolling release
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-latest
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk lingonect.apk

          {
            echo "Latest Lingonect Android test build."
            echo
            echo "**Install on a phone:** open this page on the device and tap"
            echo "\`lingonect.apk\` below. Android will ask you to allow installs"
            echo "from your browser the first time. On Samsung devices also turn off"
            echo "Auto Blocker (Settings > Security and privacy)."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\` |"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| Built | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo
            echo "This is a debug-signed build for testing, not a Play Store release."
            echo "It is replaced by the next build on main; the download link stays the same."
          } > notes.md

          # Update the release in place rather than deleting and recreating it.
          # Deleting first raced with the recreate (gh could still see the tag it
          # had just removed, and the publish failed), and it left a window where
          # the download URL 404'd — bad for a link meant to be bookmarked on a
          # phone. --clobber replaces the asset atomically instead.
          #
          # The tag therefore stays on the commit where the release was first
          # created. That is deliberate: a stable link matters more here than a
          # moving tag, and the notes above name the exact commit that was built.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Lingonect Android — latest test build" \
              --notes-file notes.md \
              --prerelease
            gh release upload "$TAG" lingonect.apk --clobber
          else
            gh release create "$TAG" lingonect.apk \
              --target "$GITHUB_SHA" \
              --title "Lingonect Android — latest test build" \
              --notes-file notes.md \
              --prerelease
          fi

          echo "::notice::Install link: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/lingonect.apk"

  # Signed Android App Bundle for Google Play. Play takes an .aab, not an .apk,
  # and rejects anything signed with the debug key. This job stays inert until
  # ANDROID_KEYSTORE_BASE64 exists, so it costs nothing before the Play account
  # is set up and turns itself on the moment the secret is added.
  release-aab:
    name: Signed AAB (Play)
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Check whether release signing is configured
        id: gate
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret, so no Play bundle was built. See ANDROID.md."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.gate.outputs.configured == 'true'

      - name: Install dependencies
        if: steps.gate.outputs.configured == 'true'
        run: npm ci

      - name: Build web bundle and sync Capacitor
        if: steps.gate.outputs.configured == 'true'
        run: |
          npm run copy-web
          npx cap sync android

      - name: Write google-services.json (if configured)
        if: ${{ steps.gate.outputs.configured == 'true' && env.GOOGLE_SERVICES_JSON != '' }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # Written outside the repo so it cannot be committed by accident, and
      # removed again in an always() step below.
      - name: Write the upload keystore
        if: steps.gate.outputs.configured == 'true'
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "keystore written ($(wc -c < "$RUNNER_TEMP/upload.keystore") bytes)"

      # Play requires versionCode to increase on every upload, and never accepts
      # the same one twice. The run number is monotonic, so it works as-is.
      - name: Build the signed bundle
        if: steps.gate.outputs.configured == 'true'
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      # A debug-signed bundle is accepted by Gradle but rejected by Play with an
      # unhelpful message, so fail here instead, where the cause is obvious.
      - name: Check the bundle is not debug-signed
        if: steps.gate.outputs.configured == 'true'
        run: |
          set -uo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          [ -f "$AAB" ] || { echo "::error::No bundle produced at $AAB"; exit 1; }
          SIGNER=$(keytool -printcert -jarfile "$AAB" 2>/dev/null | grep -m1 "Owner:" || true)
          echo "signed by: ${SIGNER:-unknown}"
          case "$SIGNER" in
            *"Lingonect Debug"*)
              echo "::error::Bundle is signed with the committed DEBUG key. Play will reject it. Check the ANDROID_KEYSTORE_* secrets."
              exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          name: lingonect-play-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
