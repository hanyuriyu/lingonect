# Builds the Lingonect Android app and publishes an installable APK as a
# workflow artifact. Android needs no Mac, so CI can produce a testable build
# on every push — download the artifact, copy it to a phone, install.
#
# Builds on main are also published to a GitHub Release under a fixed tag, so
# there is one permanent URL you can open directly on a phone to install the
# latest test build — no GitHub login, no zip, no expiry.

name: Android

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "**.html"
      - "*.css"
      - "app-native.js"
      - "android/**"
      - "assets/**"
      - "scripts/copy-web.mjs"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same branch.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Debug APK (sideload)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to publish the release below
    # The `secrets` context is not available in step-level `if:`, so surface the
    # optional Firebase config as an env var the steps can test and consume.
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Capacitor 7 requires JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # copy-web.mjs stages the plain HTML/CSS/images into www/, then Capacitor
      # copies www/ into the native project. No bundler involved.
      - name: Build web bundle and sync Capacitor
        run: |
          npm run copy-web
          npx cap sync android

      # google-services.json is not in the repo by default. Without it the app
      # still builds and email/password login works; Google Sign-In needs it.
      # Add it as a repository secret to enable Google Sign-In in CI builds.
      - name: Write google-services.json (if configured)
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "google-services.json written ($(wc -c < android/app/google-services.json) bytes)"

      - name: Report Google Sign-In availability
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "::notice::google-services.json present — Google Sign-In enabled in this build."
          else
            echo "::warning::No google-services.json — this build has email/password login only. Google Sign-In will show an error. See ANDROID.md."
          fi

      # Stamp a distinguishable version into the APK. The version name shows up
      # under Settings > Apps > Lingonect on the phone, so you can confirm which
      # build you are actually looking at while testing.
      - name: Work out the version
        id: version
        run: |
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the artifact after the commit
        id: name
        run: echo "apk=lingonect-debug-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ---- Publish the installable link ----
      # A single rolling release under a fixed tag. The download URL therefore
      # never changes and can be bookmarked on a phone:
      #   https://github.com/<owner>/<repo>/releases/download/android-latest/lingonect.apk
      # Only main publishes, so branch and PR builds do not overwrite the link;
      # a manual run can publish too, for testing this workflow itself.
      - name: Publish rolling release
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-latest
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk lingonect.apk

          {
            echo "Latest Lingonect Android test build."
            echo
            echo "**Install on a phone:** open this page on the device and tap"
            echo "\`lingonect.apk\` below. Android will ask you to allow installs"
            echo "from your browser the first time. On Samsung devices also turn off"
            echo "Auto Blocker (Settings > Security and privacy)."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\` |"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| Built | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo
            echo "This is a debug-signed build for testing, not a Play Store release."
            echo "It is replaced by the next build on main; the download link stays the same."
          } > notes.md

          # Recreate rather than edit, so no stale asset is left behind. --target
          # pins the tag to the commit actually built; without it gh points the
          # tag at the default branch, which would misreport a manual run.
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" lingonect.apk \
            --target "$GITHUB_SHA" \
            --title "Lingonect Android — latest test build" \
            --notes-file notes.md \
            --prerelease

          echo "::notice::Install link: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/lingonect.apk"
